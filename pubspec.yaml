name: smart_dukan
description: "Smart Dukan — offline-first shop accounting for Pakistani shopkeepers. Aapka hisaab, sirf aapke phone par."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

# Spec Section 6. Exact versions are pinned in pubspec.lock.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State and navigation
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0

  # Database (encrypted SQLite via SQLite3MultipleCiphers — see hooks below)
  drift: ^2.30.0
  sqlite3: ^3.0.0
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.0

  # Security
  flutter_secure_storage: ^11.0.0
  cryptography: ^2.7.0
  local_auth: ^3.0.0

  # Documents, sharing, files
  pdf: ^3.11.0
  printing: ^5.14.0
  share_plus: ^13.0.0
  url_launcher: ^6.3.0
  file_picker: ^13.0.0
  csv: ^8.0.0
  excel: ^4.0.6
  archive: ^3.6.1

  # Camera and photos
  mobile_scanner: ^7.0.0
  image_picker: ^1.1.0
  flutter_image_compress: ^2.4.0

  # Deep link smartdukan://activate
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.0
  drift_dev: ^2.30.0

# Encrypted database: package:sqlite3 bundles SQLite3MultipleCiphers, which
# supports `PRAGMA key` (SQLCipher-compatible). See DECISIONS.md D-008.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-Bold.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
