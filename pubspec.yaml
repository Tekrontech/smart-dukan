name: smart_dukan
description: "Smart Dukan — offline-first shop accounting for Pakistani shopkeepers. Aapka hisaab, sirf aapke phone par."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.27.0"

# Milestone 1 dependencies only. Later milestones add drift, sqlcipher,
# secure storage, pdf, etc. (see spec Section 6). Versions are resolved and
# pinned in pubspec.lock on first `flutter pub get`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # FONTS — see assets/fonts/README.md. Download the three TTF families into
  # assets/fonts/, then uncomment this block. Until then the app uses the
  # system font (Roboto / Noto) so it still builds and runs.
  #
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #   - family: NotoNastaliqUrdu
  #     fonts:
  #       - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
  #       - asset: assets/fonts/NotoNastaliqUrdu-Bold.ttf
  #         weight: 700
  #   - family: NotoNaskhArabic
  #     fonts:
  #       - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
  #       - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
  #         weight: 700
